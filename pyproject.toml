[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-model-assurance"
version = "0.1.0"
description = "Offline-first model artefact and inference security assessment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Community contributors"}]
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
model-assure = "model_assurance.cli:main"
[tool.setuptools.packages.find]
include = ["model_assurance*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
